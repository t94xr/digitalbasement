<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>{{ site.title }}
        {% if page.title %}
         - {{ page.title }}
        {% endif %}
    </title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    corePlugins: {
      preflight: false, // This disables the automatic resets
    }
  }
</script>

<link rel='stylesheet' href='{{ site.url }}/assets/css/style.css' type='text/css'>    
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% if site.highlighter %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
{% endif %}

<meta name='viewport' content='width=device-width, initial-scale=1'>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans+Extra+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">


</head>

<body class="text-[11pt] align-middle subpixel-antialiased leading-6 text-gray-800 bg-gray-100 mt-10 mb-10">

<main class="max-w-[1000px] mx-auto gap-0 border bg-white p-10 rounded-md shadow-sm">

    {% include header.html %}

    {{ content }}
</main>

</body>
</html>
